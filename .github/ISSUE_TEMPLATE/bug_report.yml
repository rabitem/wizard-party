name: Bug report
description: Something in the game or on the site does not work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Please search the open issues first.
        Security problems do not belong here: report them privately at https://github.com/rabitem/wizard-party/security/advisories/new.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the problem. Include error messages exactly as shown.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The shortest sequence that triggers it. Mention the room settings or ruleset if they matter.
      placeholder: |
        1. Create a room with 4 players (2 bots)
        2. Bid 1 in round 3
        3. Play the wizard
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 141, Safari 26, Firefox 145
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11, macOS 26, iOS 26, Android 16
    validations:
      required: true

  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - Desktop or laptop
        - Phone
        - Tablet
    validations:
      required: true

  - type: input
    id: room-code
    attributes:
      label: Room code (optional)
      description: Helps find the game in the server logs if you report it soon after it happened.

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or recordings
      description: Drag files here. Browser console output helps with crashes and rendering issues.
