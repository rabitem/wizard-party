name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify application
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run check:worker
      # Chromium for the golden path; its OS packages are installed on every run, the browser only on a cache miss.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      # One local worker serves both checks: the smoke test's raw sockets, then the golden path, which
      # plays the build above (next start on localhost, so the app picks the local worker) in Chromium.
      - name: Multiplayer smoke test and golden path
        shell: bash
        run: |
          npm run dev:party > "$RUNNER_TEMP/wizard-worker.log" 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:1999/health > /dev/null; then
              break
            fi
            sleep 1
          done
          if ! node scripts/realtime-smoke.mjs; then
            cat "$RUNNER_TEMP/wizard-worker.log"
            exit 1
          fi
          if ! npx playwright test --project=golden-path; then
            cat "$RUNNER_TEMP/wizard-worker.log"
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() || cancelled()
        with:
          name: golden-path
          path: |
            e2e-report/
            e2e-results/
          if-no-files-found: ignore
          retention-days: 7
