name: Browser suites

# The Playwright suites drive the animation sandbox in real browsers. Hosted runners have no GPU,
# so WebGL renders in software: runs are slow and frame-time budgets are not meaningful here
# (run `npm run e2e:perf` on real hardware for those). This workflow checks correctness:
# animation sequences, layouts per device and reconnect behaviour on every engine, Firefox included,
# plus the deterministic render/React budgets, fault injection, touch input, visual baselines, the
# viewport and settings matrices on every engine, and the golden path through the real app.
#
# - Pull requests labelled `e2e`: Chromium and one touch phone.
# - Manual dispatch: every project in two shards (inputs: grep, update_snapshots).
# - Weekly: every project in four shards, with E2E_FULL_MATRIX=1 (every table size, every viewport,
#   every pair of settings).
#
# The app is built once (job `build`) and every project job downloads that build, so a run costs one
# `next build`, not one per job. Browsers are cached per engine.
#
# Visual baselines are generated here, never locally: dispatch the workflow with update_snapshots,
# download the visual-baselines-<project> artifacts and commit their e2e/visual.spec.ts-snapshots.
# Known product bugs are quarantined in e2e/support/known-issues.ts, not skipped silently.

on:
  pull_request:
    branches: [main]
    types: [labeled, synchronize, reopened]
  workflow_dispatch:
    inputs:
      grep:
        description: 'Only run tests whose title matches (Playwright --grep)'
        required: false
        default: ''
      update_snapshots:
        description: 'Regenerate the visual baselines and upload them as artifacts (runs only e2e/visual.spec.ts)'
        type: boolean
        required: false
        default: false
  schedule:
    - cron: '0 3 * * 0'

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan the browser matrix
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      include: ${{ steps.plan.outputs.include }}
    steps:
      # The project names are the projects in playwright.config.ts; `engine` is what to install.
      - id: plan
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          UPDATE_SNAPSHOTS: ${{ inputs.update_snapshots }}
        run: |
          desktop='"chromium","firefox","webkit","chrome","edge"'
          devices='"android-phone","android-landscape","android-tablet","fold-cover","fold-open","iphone","iphone-landscape","iphone-se","iphone-pro-max","ipad","ipad-landscape","ipad-mini","chromium-hidpi","firefox-hidpi","touch-laptop"'
          matrices='"viewport-matrix","viewport-matrix-firefox","viewport-matrix-webkit","settings-matrix","settings-matrix-firefox","settings-matrix-webkit","settings-matrix-phone"'
          golden='"golden-path","golden-path-firefox","golden-path-webkit","golden-path-android","golden-path-iphone"'
          if [ "$EVENT" = pull_request ]; then
            projects='["chromium","android-phone"]'; shards=1
          elif [ "$UPDATE_SNAPSHOTS" = true ]; then
            # Only the projects that run e2e/visual.spec.ts.
            projects="[$desktop,$devices]"; shards=1
          elif [ "$EVENT" = schedule ]; then
            projects="[$desktop,$devices,$matrices,$golden]"; shards=4
          else
            projects="[$desktop,$devices,$matrices,$golden]"; shards=2
          fi
          include=$(jq -cn --argjson projects "$projects" --argjson shards "$shards" '
            def engine:
              if . == "chrome" then "chrome"
              elif . == "edge" then "msedge"
              elif test("firefox") then "firefox"
              elif test("^(webkit|iphone|ipad)|-(webkit|iphone)$") then "webkit"
              else "chromium" end;
            [ $projects[] as $project | range(1; $shards + 1) as $shard
              | { project: $project, engine: ($project | engine), shard: $shard, shards: $shards } ]')
          echo "include=$include" >> "$GITHUB_OUTPUT"

  build:
    name: Build the app with the sandbox
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run e2e:build
      # One archive keeps the build's many small files fast to upload; the build cache stays behind.
      - run: tar -cf e2e-build.tar --exclude=.next/cache .next
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-build
          path: e2e-build.tar
          if-no-files-found: error
          retention-days: 1

  e2e:
    name: ${{ matrix.project }} ${{ matrix.shard }}/${{ matrix.shards }}
    needs: [plan, build]
    runs-on: ubuntu-latest
    # The matrices play every viewport (up to 4K, device pixel ratios up to 3) or every pair of
    # settings in software WebGL; they get twice the time of a project suite.
    timeout-minutes: ${{ contains(matrix.project, '-matrix') && 180 || 90 }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.include) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-build
      - run: tar -xf e2e-build.tar && rm e2e-build.tar
      # Playwright's own builds are cached; the branded Chrome and Edge install from their vendors.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ matrix.engine != 'chrome' && matrix.engine != 'msedge' }}
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ matrix.engine }}-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      # The golden path plays the real app against the local game worker (see ci.yml).
      - name: Start the game worker
        if: ${{ startsWith(matrix.project, 'golden-path') && !inputs.update_snapshots }}
        shell: bash
        run: |
          nohup npm run dev:party > "$RUNNER_TEMP/wizard-worker.log" 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:1999/health > /dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/wizard-worker.log"
          exit 1
      - name: Run the suites
        if: ${{ !inputs.update_snapshots }}
        env:
          E2E_WORKERS: '2'
          E2E_FULL_MATRIX: ${{ github.event_name == 'schedule' && '1' || '0' }}
          GREP: ${{ inputs.grep }}
        # A narrow grep or a small project can leave a shard without tests.
        run: npx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}/${{ matrix.shards }} --pass-with-no-tests --grep-invert "sustains" ${GREP:+--grep "$GREP"}
      - name: Print the worker log
        if: ${{ failure() && startsWith(matrix.project, 'golden-path') }}
        run: cat "$RUNNER_TEMP/wizard-worker.log" || true
      - name: Update the visual baselines
        if: ${{ inputs.update_snapshots }}
        env:
          E2E_WORKERS: '1'
        run: npx playwright test e2e/visual.spec.ts --project=${{ matrix.project }} --update-snapshots=all
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ inputs.update_snapshots }}
        with:
          name: visual-baselines-${{ matrix.project }}
          path: e2e/visual.spec.ts-snapshots/
          if-no-files-found: error
          retention-days: 14
      # Also on a timeout: a cancelled job is the one whose traces are needed most.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() || cancelled()
        with:
          name: e2e-${{ matrix.project }}-${{ matrix.shard }}
          path: |
            e2e-report/
            e2e-results/
          retention-days: 7
